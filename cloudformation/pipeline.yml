AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Infra Pipeline — bootstrapped once via deploy.sh.
  On every push to the infra repo, CodeBuild runs buildspec.yml
  which deploys main.yml (VPC, EC2, CodeDeploy, React pipeline).

# ──────────────────────────────────────────────────────────────
# PARAMETERS
# ──────────────────────────────────────────────────────────────
Parameters:

  Project:
    Type: String
    Description: Name of the project — used as prefix for all resource names

  Environment:
    Type: String
    AllowedValues: [dev, staging, prod]
    Description: Deployment environment

  ConnectionArn:
    Type: String
    Description: ARN of the CodeStar connection to GitHub

  InfraRepository:
    Type: String
    Description: GitHub repo for infra code — format owner/repo

  InfraBranch:
    Type: String
    Description: Branch to track e.g. main

  ArtifactsBucket:
    Type: String
    Description: >
      S3 bucket name for CodePipeline artifacts.
      Created by this template and shared with main.yml.

# ──────────────────────────────────────────────────────────────
# RESOURCES
# ──────────────────────────────────────────────────────────────
Resources:

  # ── S3 — Artifact bucket (created ONCE here, shared with main.yml) ──
  ArtifactBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref ArtifactsBucket
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldArtifacts
            Status: Enabled
            ExpirationInDays: 30
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  # ── IAM — Pipeline + CodeBuild role ─────────────────────────
  PipelineRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${Project}-${Environment}-pipeline-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - codepipeline.amazonaws.com
                - codebuild.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InfraPipelinePermissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: S3Access
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:GetObjectVersion
                  - s3:ListBucket
                Resource:
                  - !Sub arn:aws:s3:::${ArtifactsBucket}
                  - !Sub arn:aws:s3:::${ArtifactsBucket}/*
              - Sid: IAMAccess
                Effect: Allow
                Action:
                  - iam:PassRole
                  - iam:GetRole
                  - iam:GetRolePolicy
                  - iam:ListAttachedRolePolicies
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:PutRolePolicy
                  - iam:TagRole
                  - iam:GetInstanceProfile
                  - iam:ListInstanceProfiles
                  - iam:CreateInstanceProfile
                  - iam:DeleteInstanceProfile
                  - iam:AddRoleToInstanceProfile
                  - iam:RemoveRoleFromInstanceProfile
                Resource: "*"
              - Sid: CloudFormationAccess
                Effect: Allow
                Action:
                  - cloudformation:CreateStack
                  - cloudformation:UpdateStack
                  - cloudformation:DeleteStack
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStackResources
                  - cloudformation:GetTemplate
                  - cloudformation:ValidateTemplate
                  - cloudformation:ListStacks
                Resource: "*"
              - Sid: EC2Access
                Effect: Allow
                Action:
                  - ec2:*
                Resource: "*"
              - Sid: CICDAccess
                Effect: Allow
                Action:
                  - codepipeline:*
                  - codebuild:*
                  - codedeploy:*
                Resource: "*"
              - Sid: SSMAccess
                Effect: Allow
                Action:
                  - ssm:*
                Resource: "*"
              - Sid: LogsAccess
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:DescribeLogGroups
                  - logs:DescribeLogStreams
                Resource: "*"
              - Sid: CodeStarConnection
                Effect: Allow
                Action:
                  - codestar-connections:UseConnection
                Resource: !Ref ConnectionArn

  # ── CodeBuild — runs buildspec.yml to deploy main.yml ───────
  InfraCodeBuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub ${Project}-infra-${Environment}
      Description: Deploys main.yml (VPC, EC2, CodeDeploy, React pipeline)
      Source:
        Type: CODEPIPELINE
        BuildSpec: buildspec.yml
      Artifacts:
        Type: CODEPIPELINE
      ServiceRole: !GetAtt PipelineRole.Arn
      TimeoutInMinutes: 20
      Environment:
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/standard:7.0
        Type: LINUX_CONTAINER
        EnvironmentVariables:
          - Name: STACK_NAME
            Value: !Sub ${Project}-infra-${Environment}
          - Name: PROJECT
            Value: !Ref Project
          - Name: ENVIRONMENT
            Value: !Ref Environment
          - Name: ARTIFACTS_BUCKET
            Value: !Ref ArtifactsBucket
      LogsConfig:
        CloudWatchLogs:
          Status: ENABLED
          GroupName: !Sub /aws/codebuild/${Project}-infra-${Environment}

  # ── CodePipeline — Source → Build ───────────────────────────
  InfraPipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      Name: !Sub ${Project}-infra-${Environment}
      RoleArn: !GetAtt PipelineRole.Arn
      ArtifactStore:
        Type: S3
        Location: !Ref ArtifactBucket
      Stages:

        - Name: Source
          Actions:
            - Name: FetchSource
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: CodeStarSourceConnection
                Version: 1
              Configuration:
                ConnectionArn: !Ref ConnectionArn
                FullRepositoryId: !Ref InfraRepository
                BranchName: !Ref InfraBranch
                DetectChanges: true
                OutputArtifactFormat: CODE_ZIP
              OutputArtifacts:
                - Name: SourceOutput

        - Name: Build
          Actions:
            - Name: DeployInfrastructure
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: 1
              InputArtifacts:
                - Name: SourceOutput
              OutputArtifacts:
                - Name: BuildOutput
              Configuration:
                ProjectName: !Ref InfraCodeBuildProject

# ──────────────────────────────────────────────────────────────
# OUTPUTS
# ──────────────────────────────────────────────────────────────
Outputs:

  InfraPipelineName:
    Description: Name of the infra CodePipeline
    Value: !Ref InfraPipeline

  ArtifactBucketName:
    Description: S3 bucket used for pipeline artifacts (shared with main.yml)
    Value: !Ref ArtifactBucket
