AWSTemplateFormatVersion: '2010-09-09'
Description: >
  CodePipeline for deploying infrastructure (VPC, EC2, CodeDeploy, React pipeline).
  Push to infra repo → CodeBuild runs deploy.sh → deploys main.yml → React pipeline is live.

# ──────────────────────────────────────────────────────────────
# PARAMETERS
# ──────────────────────────────────────────────────────────────
Parameters:

  ConnectionArn:
    Type: String
    Description: ARN of the CodeStar connection to GitHub

  InfraRepository:
    Type: String
    Description: GitHub repo for infra — format owner/repo

  InfraBranch:
    Type: String
    Description: Branch to track

  Environment:
    Type: String
    AllowedValues: [dev, staging, prod]

  Project:
    Type: String
    Description: Name of the project

  S3Bucket:
    Type: String
    Description: S3 bucket name for CodePipeline artifacts

# ──────────────────────────────────────────────────────────────
# RESOURCES
# ──────────────────────────────────────────────────────────────
Resources:

  ArtifactBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref S3Bucket
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  PipelineRole:
    Type: AWS::IAM::Role
    DependsOn: ArtifactBucket
    Properties:
      RoleName: !Sub ${Project}-${Environment}-pipeline-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - codepipeline.amazonaws.com
                - codebuild.amazonaws.com
                - codedeploy.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: PipelinePermissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:GetObjectVersion
                  - s3:ListBucket
                Resource:
                  - !Sub arn:aws:s3:::${S3Bucket}
                  - !Sub arn:aws:s3:::${S3Bucket}/*
              - Effect: Allow
                Action:
                  - iam:PassRole
                  - iam:GetRole
                  - iam:GetRolePolicy
                  - iam:ListAttachedRolePolicies
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:PutRolePolicy
                  - iam:TagRole
                Resource: "*"
              - Effect: Allow
                Action:
                  - iam:GetInstanceProfile
                  - iam:ListInstanceProfiles
                  - iam:CreateInstanceProfile
                  - iam:DeleteInstanceProfile
                  - iam:AddRoleToInstanceProfile
                  - iam:RemoveRoleFromInstanceProfile
                Resource: "*"
              - Effect: Allow
                Action:
                  - cloudformation:*
                  - ec2:*
                  - ssm:*
                  - cloudwatch:*
                  - autoscaling:*
                  - elasticloadbalancing:*
                  - codepipeline:*
                  - codebuild:*
                  - codedeploy:*
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "*"
              - Effect: Allow
                Action:
                  - ssm:PutParameter
                  - ssm:GetParameter
                  - ssm:DeleteParameter
                Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${Project}/${Environment}/*
              - Effect: Allow
                Action:
                  - codestar-connections:UseConnection
                Resource: !Ref ConnectionArn
              - Effect: Allow
                Action: "*"
                Resource: "*"

  InfraCodeBuildProject:
    Type: AWS::CodeBuild::Project
    DependsOn: PipelineRole
    Properties:
      Name: !Join ["-", [!Ref Project, "infra", !Ref Environment]]
      Source:
        Type: CODEPIPELINE
        BuildSpec: buildspec.yml
      Artifacts:
        Type: CODEPIPELINE
      ServiceRole: !GetAtt PipelineRole.Arn
      TimeoutInMinutes: 20
      Environment:
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/standard:7.0
        Type: LINUX_CONTAINER
        EnvironmentVariables:
          - Name: STACK_NAME
            Value: !Join ["-", [!Ref Project, "infra", !Ref Environment]]
          - Name: ENVIRONMENT
            Value: !Ref Environment
          - Name: PROJECT
            Value: !Ref Project
      LogsConfig:
        CloudWatchLogs:
          Status: ENABLED
          GroupName: !Sub /aws/codebuild/${Project}-infra-${Environment}

  InfraPipeline:
    Type: AWS::CodePipeline::Pipeline
    DependsOn:
      - ArtifactBucket
      - InfraCodeBuildProject
    Properties:
      Name: !Join ["-", [!Ref Project, "infra", !Ref Environment]]
      RoleArn: !GetAtt PipelineRole.Arn
      ArtifactStore:
        Type: S3
        Location: !Ref ArtifactBucket
      Stages:

        - Name: Source
          Actions:
            - Name: FetchSource
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: CodeStarSourceConnection
                Version: 1
              Configuration:
                ConnectionArn: !Ref ConnectionArn
                FullRepositoryId: !Ref InfraRepository
                BranchName: !Ref InfraBranch
                DetectChanges: true
                OutputArtifactFormat: CODE_ZIP
              OutputArtifacts:
                - Name: SourceOutput

        - Name: Build
          Actions:
            - Name: DeployInfrastructure
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: 1
              InputArtifacts:
                - Name: SourceOutput
              OutputArtifacts:
                - Name: BuildOutput
              Configuration:
                ProjectName: !Ref InfraCodeBuildProject

# ──────────────────────────────────────────────────────────────
# OUTPUTS
# ──────────────────────────────────────────────────────────────
Outputs:

  InfraPipelineName:
    Description: Name of the infra CodePipeline
    Value: !Ref InfraPipeline

  ArtifactBucketName:
    Description: S3 bucket for pipeline artifacts
    Value: !Ref ArtifactBucket
