AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Main infrastructure stack — deployed by the Infra Pipeline (buildspec.yml).
  Creates: EC2, CodeDeploy, IAM roles, and the React App CodePipeline.
  Uses an existing VPC and subnet (default VPC) — no new VPC is created.
  The S3 artifact bucket is NOT created here — it already exists from pipeline.yml.

# ──────────────────────────────────────────────────────────────
# PARAMETERS
# ──────────────────────────────────────────────────────────────
Parameters:

  Project:
    Type: String
    Description: Project name prefix for all resources

  Environment:
    Type: String
    AllowedValues: [dev, staging, prod]
    Description: Deployment environment

  ConnectionArn:
    Type: String
    Description: ARN of the CodeStar connection to GitHub

  ReactRepository:
    Type: String
    Description: GitHub repo for React app — format owner/repo

  ReactBranch:
    Type: String
    Default: main
    Description: Branch to track for React app deployments

  ArtifactsBucket:
    Type: String
    Description: >
      Existing S3 bucket for pipeline artifacts.
      Already created by pipeline.yml — do NOT recreate here.

  EC2InstanceType:
    Type: String
    Default: t3.micro
    AllowedValues: [t3.micro, t3.small, t3.medium]

  SSHAccessCIDR:
    Type: String
    Description: Your IP in CIDR notation for SSH access e.g. 203.0.113.10/32
    AllowedPattern: (\d{1,3}\.){3}\d{1,3}/32

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: Existing VPC ID to deploy into (use default VPC)

  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Existing public subnet ID within the VPC

# ──────────────────────────────────────────────────────────────
# MAPPINGS — Amazon Linux 2023 AMI per region
# ──────────────────────────────────────────────────────────────
Mappings:
  AmiMap:
    us-east-1:      { AMI: ami-0f9de6e2d2f067fca }
    us-east-2:      { AMI: ami-0490fddec0cbeb88b }
    us-west-1:      { AMI: ami-0a6dc7529cd559185 }
    us-west-2:      { AMI: ami-05572e392e80aee89 }
    ap-south-1:     { AMI: ami-0f58b397bc5c1f2e8 }
    ap-southeast-1: { AMI: ami-0b825ad86ddcfb907 }
    ap-southeast-2: { AMI: ami-0310483fb2b488153 }
    eu-west-1:      { AMI: ami-0fed63ea358539e44 }
    eu-central-1:   { AMI: ami-0faab6bdbac9486fb }

# ──────────────────────────────────────────────────────────────
# RESOURCES
# ──────────────────────────────────────────────────────────────
Resources:

  # ════════════════════════════════════════════
  # SECURITY GROUP
  # ════════════════════════════════════════════

  EC2SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub ${Project}-${Environment} — HTTP public, SSH restricted
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref SSHAccessCIDR
      Tags:
        - Key: Name
          Value: !Sub ${Project}-${Environment}-ec2-sg

  # ════════════════════════════════════════════
  # EC2 KEY PAIR (auto-created, private key stored in SSM)
  # ════════════════════════════════════════════

  EC2KeyPair:
    Type: AWS::EC2::KeyPair
    Properties:
      KeyName: !Sub ${Project}-${Environment}-keypair
      KeyType: rsa
      Tags:
        - Key: Name
          Value: !Sub ${Project}-${Environment}-keypair

  # ════════════════════════════════════════════
  # IAM — EC2 instance role
  # ════════════════════════════════════════════

  EC2InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${Project}-${Environment}-ec2-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonEC2RoleforAWSCodeDeploy
        - arn:aws:iam::aws:policy/AmazonS3ReadOnlyAccess
        - arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy

  EC2InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub ${Project}-${Environment}-ec2-profile
      Roles:
        - !Ref EC2InstanceRole

  # ════════════════════════════════════════════
  # IAM — React pipeline role
  # ════════════════════════════════════════════

  ReactPipelineRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${Project}-${Environment}-react-pipeline-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - codepipeline.amazonaws.com
                - codebuild.amazonaws.com
                - codedeploy.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ReactPipelinePermissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: S3ArtifactAccess
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:GetObjectVersion
                  - s3:ListBucket
                Resource:
                  - !Sub arn:aws:s3:::${ArtifactsBucket}
                  - !Sub arn:aws:s3:::${ArtifactsBucket}/*
              - Sid: CodeBuildAccess
                Effect: Allow
                Action:
                  - codebuild:BatchGetBuilds
                  - codebuild:StartBuild
                  - codebuild:BatchGetBuildBatches
                  - codebuild:StartBuildBatch
                Resource: !Sub arn:aws:codebuild:${AWS::Region}:${AWS::AccountId}:project/*
              - Sid: CodeDeployAccess
                Effect: Allow
                Action:
                  - codedeploy:CreateDeployment
                  - codedeploy:GetApplication
                  - codedeploy:GetApplicationRevision
                  - codedeploy:GetDeployment
                  - codedeploy:GetDeploymentConfig
                  - codedeploy:RegisterApplicationRevision
                Resource: "*"
              - Sid: CodeStarConnection
                Effect: Allow
                Action:
                  - codestar-connections:UseConnection
                Resource: !Ref ConnectionArn
              - Sid: CloudWatchLogs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "*"
              - Sid: SSMParameterAccess
                Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${Project}/${Environment}/*

  # ════════════════════════════════════════════
  # EC2 INSTANCE
  # ════════════════════════════════════════════

  EC2Instance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref EC2InstanceType
      KeyName: !Ref EC2KeyPair
      ImageId: !FindInMap [AmiMap, !Ref AWS::Region, AMI]
      SubnetId: !Ref SubnetId
      SecurityGroupIds:
        - !Ref EC2SecurityGroup
      IamInstanceProfile: !Ref EC2InstanceProfile
      Tags:
        - Key: Name
          Value: !Sub ${Project}-${Environment}-server
        - Key: Project
          Value: !Ref Project
        - Key: Environment
          Value: !Ref Environment
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -e
          dnf update -y

          # Install CodeDeploy Agent (Amazon Linux 2023)
          dnf install -y ruby wget
          cd /tmp
          wget https://aws-codedeploy-${AWS::Region}.s3.${AWS::Region}.amazonaws.com/latest/install
          chmod +x ./install
          ./install auto
          systemctl start codedeploy-agent
          systemctl enable codedeploy-agent

          # Install nginx (Amazon Linux 2023)
          dnf install -y nginx

          # Remove default server block so conf.d/react-app.conf owns port 80
          sed -i '/^    server {/,/^    }/d' /etc/nginx/nginx.conf

          systemctl enable nginx

          # Ensure web root exists with correct ownership
          mkdir -p /var/www/html
          chown -R nginx:nginx /var/www/html

          echo "Bootstrap complete: ${Project}-${Environment}"

  # ════════════════════════════════════════════
  # CODEDEPLOY
  # ════════════════════════════════════════════

  CodeDeployServiceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${Project}-${Environment}-codedeploy-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codedeploy.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSCodeDeployRole

  CodeDeployApplication:
    Type: AWS::CodeDeploy::Application
    Properties:
      ApplicationName: !Sub ${Project}-${Environment}-app
      ComputePlatform: Server

  CodeDeployDeploymentGroup:
    Type: AWS::CodeDeploy::DeploymentGroup
    DependsOn: EC2Instance
    Properties:
      ApplicationName: !Ref CodeDeployApplication
      DeploymentGroupName: !Sub ${Project}-${Environment}-deployment-group
      ServiceRoleArn: !GetAtt CodeDeployServiceRole.Arn
      DeploymentConfigName: CodeDeployDefault.AllAtOnce
      Ec2TagFilters:
        - Key: Name
          Value: !Sub ${Project}-${Environment}-server
          Type: KEY_AND_VALUE
      DeploymentStyle:
        DeploymentOption: WITHOUT_TRAFFIC_CONTROL
        DeploymentType: IN_PLACE
      AutoRollbackConfiguration:
        Enabled: true
        Events:
          - DEPLOYMENT_FAILURE

  # ════════════════════════════════════════════
  # CODEBUILD — React app build
  # ════════════════════════════════════════════

  ReactCodeBuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub ${Project}-react-${Environment}
      Description: Builds the React SPA (npm install + npm run build)
      Source:
        Type: CODEPIPELINE
        BuildSpec: buildspec.yml
      Artifacts:
        Type: CODEPIPELINE
      ServiceRole: !GetAtt ReactPipelineRole.Arn
      TimeoutInMinutes: 20
      Environment:
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/standard:7.0
        Type: LINUX_CONTAINER
        EnvironmentVariables:
          - Name: PROJECT
            Value: !Ref Project
          - Name: ENVIRONMENT
            Value: !Ref Environment
          - Name: NODE_ENV
            Value: production
      Cache:
        Type: S3
        Location: !Sub ${ArtifactsBucket}/cache/react-${Environment}
      LogsConfig:
        CloudWatchLogs:
          Status: ENABLED
          GroupName: !Sub /aws/codebuild/${Project}-react-${Environment}

  # ════════════════════════════════════════════
  # CODEPIPELINE — React app (Source → Build → Deploy)
  # ════════════════════════════════════════════

  ReactPipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      Name: !Sub ${Project}-react-${Environment}
      RoleArn: !GetAtt ReactPipelineRole.Arn
      ArtifactStore:
        Type: S3
        Location: !Ref ArtifactsBucket
      Stages:

        - Name: Source
          Actions:
            - Name: FetchSource
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: CodeStarSourceConnection
                Version: 1
              Configuration:
                ConnectionArn: !Ref ConnectionArn
                FullRepositoryId: !Ref ReactRepository
                BranchName: !Ref ReactBranch
                DetectChanges: true
                OutputArtifactFormat: CODE_ZIP
              OutputArtifacts:
                - Name: SourceOutput

        - Name: Build
          Actions:
            - Name: BuildReactApp
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: 1
              InputArtifacts:
                - Name: SourceOutput
              OutputArtifacts:
                - Name: BuildOutput
              Configuration:
                ProjectName: !Ref ReactCodeBuildProject

        - Name: Deploy
          Actions:
            - Name: DeployToEC2
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Provider: CodeDeploy
                Version: 1
              InputArtifacts:
                - Name: BuildOutput
              Configuration:
                ApplicationName: !Ref CodeDeployApplication
                DeploymentGroupName: !Ref CodeDeployDeploymentGroup

# ──────────────────────────────────────────────────────────────
# OUTPUTS
# ──────────────────────────────────────────────────────────────
Outputs:

  WebAppURL:
    Description: Public URL of the React application
    Value: !Sub http://${EC2Instance.PublicDnsName}
    Export:
      Name: !Sub ${Project}-${Environment}-WebAppURL

  EC2PublicIP:
    Description: EC2 Public IP
    Value: !GetAtt EC2Instance.PublicIp
    Export:
      Name: !Sub ${Project}-${Environment}-EC2IP

  ReactPipelineURL:
    Description: React app CodePipeline console URL
    Value: !Sub https://${AWS::Region}.console.aws.amazon.com/codesuite/codepipeline/pipelines/${Project}-react-${Environment}/view

  CodeDeployAppName:
    Description: CodeDeploy Application name
    Value: !Ref CodeDeployApplication

  SSHCommand:
    Description: SSH into EC2 (after downloading key from SSM)
    Value: !Sub ssh -i ${Project}-${Environment}-keypair.pem ec2-user@${EC2Instance.PublicIp}

  SSMKeyCommand:
    Description: CLI command to download the EC2 private key from SSM
    Value: !Sub >
      aws ssm get-parameter
      --name /ec2/keypair/${EC2KeyPair.KeyPairId}
      --with-decryption
      --query Parameter.Value
      --output text
      --region ${AWS::Region}
      > ${Project}-${Environment}-keypair.pem && chmod 400 ${Project}-${Environment}-keypair.pem
