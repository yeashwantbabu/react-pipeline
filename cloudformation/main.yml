AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Full infrastructure for React SPA CI/CD.
  Creates: VPC, EC2, CodeDeploy, S3, IAM,
  and the React App CodePipeline (Source → Build → Deploy).
  Triggered by the Infra Pipeline after infra is ready.

# ──────────────────────────────────────────────────────────────
# PARAMETERS  (all values come from parameters.json — no hardcoding)
# ──────────────────────────────────────────────────────────────
Parameters:

  Project:
    Type: String
    Description: Project name prefix for all resources

  Environment:
    Type: String
    AllowedValues: [dev, staging, prod]
    Description: Deployment environment

  ConnectionArn:
    Type: String
    Description: ARN of the CodeStar connection to GitHub

  ReactRepository:
    Type: String
    Description: GitHub repo for React app — format owner/repo

  ReactBranch:
    Type: String
    Default: main
    Description: Branch to track for React app deployments

  ArtifactsBucket:
    Type: String
    Description: S3 bucket name for pipeline artifacts (shared with infra pipeline)

  EC2InstanceType:
    Type: String
    Default: t3.micro
    AllowedValues: [t3.micro, t3.small, t3.medium]

  SSHAccessCIDR:
    Type: String
    Description: Your IP in CIDR notation for SSH access e.g. 203.0.113.10/32
    AllowedPattern: (\d{1,3}\.){3}\d{1,3}/32

# ──────────────────────────────────────────────────────────────
# MAPPINGS  — Amazon Linux 2023 AMI per region
# ──────────────────────────────────────────────────────────────
Mappings:
  AmiMap:
    us-east-1:      { AMI: ami-0c02fb55956c7d316 }
    us-east-2:      { AMI: ami-097a2df4ac947655f }
    us-west-1:      { AMI: ami-0d9858aa3c6322f73 }
    us-west-2:      { AMI: ami-098e42ae54c764c35 }
    ap-south-1:     { AMI: ami-0b08bfc6ff7069aff }
    ap-southeast-1: { AMI: ami-0c55b159cbfafe1f0 }
    ap-southeast-2: { AMI: ami-07620139298af599e }
    eu-west-1:      { AMI: ami-0d71ea30463e0ff49 }
    eu-central-1:   { AMI: ami-0a261c0e5f51090b1 }

# ──────────────────────────────────────────────────────────────
# RESOURCES
# ──────────────────────────────────────────────────────────────
Resources:

  # ════════════════════════════════════════════
  # NETWORKING
  # ════════════════════════════════════════════

  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub ${Project}-${Environment}-vpc

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub ${Project}-${Environment}-igw

  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub ${Project}-${Environment}-public-subnet

  RouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub ${Project}-${Environment}-rt

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachGateway
    Properties:
      RouteTableId: !Ref RouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  SubnetRouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref RouteTable

  # ════════════════════════════════════════════
  # SECURITY GROUPS
  # ════════════════════════════════════════════

  EC2SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub ${Project}-${Environment} EC2 SG — HTTP public, SSH restricted
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref SSHAccessCIDR
      Tags:
        - Key: Name
          Value: !Sub ${Project}-${Environment}-ec2-sg

  # ════════════════════════════════════════════
  # EC2 KEY PAIR  (auto-created, private key → SSM)
  # ════════════════════════════════════════════

  EC2KeyPair:
    Type: AWS::EC2::KeyPair
    Properties:
      KeyName: !Sub ${Project}-${Environment}-keypair
      KeyType: rsa
      Tags:
        - Key: Name
          Value: !Sub ${Project}-${Environment}-keypair

  # ════════════════════════════════════════════
  # IAM — EC2 instance role
  # ════════════════════════════════════════════

  EC2InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${Project}-${Environment}-ec2-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonEC2RoleforAWSCodeDeploy
        - arn:aws:iam::aws:policy/AmazonS3ReadOnlyAccess
        - arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy

  EC2InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub ${Project}-${Environment}-ec2-profile
      Roles:
        - !Ref EC2InstanceRole

  # ════════════════════════════════════════════
  # EC2 INSTANCE
  # ════════════════════════════════════════════

  EC2Instance:
    Type: AWS::EC2::Instance
    DependsOn: AttachGateway
    Properties:
      InstanceType: !Ref EC2InstanceType
      KeyName: !Ref EC2KeyPair
      ImageId: !FindInMap [AmiMap, !Ref AWS::Region, AMI]
      SubnetId: !Ref PublicSubnet
      SecurityGroupIds:
        - !Ref EC2SecurityGroup
      IamInstanceProfile: !Ref EC2InstanceProfile
      Tags:
        - Key: Name
          Value: !Sub ${Project}-${Environment}-server
        - Key: Project
          Value: !Ref Project
        - Key: Environment
          Value: !Ref Environment
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -e
          yum update -y

          # Install CodeDeploy Agent
          yum install -y ruby wget
          cd /tmp
          wget https://aws-codedeploy-${AWS::Region}.s3.${AWS::Region}.amazonaws.com/latest/install
          chmod +x ./install
          ./install auto
          systemctl start codedeploy-agent
          systemctl enable codedeploy-agent

          # Install nginx
          amazon-linux-extras enable nginx1 2>/dev/null || true
          yum install -y nginx
          systemctl enable nginx

          echo "Bootstrap complete: ${Project}-${Environment}"

  # ════════════════════════════════════════════
  # S3 ARTIFACT BUCKET  (shared with infra pipeline)
  # ════════════════════════════════════════════

  ArtifactBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref ArtifactsBucket
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldArtifacts
            Status: Enabled
            ExpirationInDays: 30
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  # ════════════════════════════════════════════
  # IAM — Pipeline role (CodePipeline + CodeBuild + CodeDeploy)
  # ════════════════════════════════════════════

  PipelineRole:
    Type: AWS::IAM::Role
    DependsOn: ArtifactBucket
    Properties:
      RoleName: !Sub ${Project}-${Environment}-react-pipeline-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - codepipeline.amazonaws.com
                - codebuild.amazonaws.com
                - codedeploy.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ReactPipelinePermissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:GetObjectVersion
                  - s3:ListBucket
                Resource:
                  - !Sub arn:aws:s3:::${ArtifactsBucket}
                  - !Sub arn:aws:s3:::${ArtifactsBucket}/*
              - Effect: Allow
                Action:
                  - codebuild:BatchGetBuilds
                  - codebuild:StartBuild
                Resource: !GetAtt ReactCodeBuildProject.Arn
              - Effect: Allow
                Action:
                  - codedeploy:CreateDeployment
                  - codedeploy:GetApplication
                  - codedeploy:GetApplicationRevision
                  - codedeploy:GetDeployment
                  - codedeploy:GetDeploymentConfig
                  - codedeploy:RegisterApplicationRevision
                Resource: "*"
              - Effect: Allow
                Action:
                  - codestar-connections:UseConnection
                Resource: !Ref ConnectionArn
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "*"
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${Project}/${Environment}/*

  # ════════════════════════════════════════════
  # CODEDEPLOY
  # ════════════════════════════════════════════

  CodeDeployServiceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${Project}-${Environment}-codedeploy-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codedeploy.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSCodeDeployRole

  CodeDeployApplication:
    Type: AWS::CodeDeploy::Application
    Properties:
      ApplicationName: !Sub ${Project}-${Environment}-app
      ComputePlatform: Server

  CodeDeployDeploymentGroup:
    Type: AWS::CodeDeploy::DeploymentGroup
    DependsOn: EC2Instance
    Properties:
      ApplicationName: !Ref CodeDeployApplication
      DeploymentGroupName: !Sub ${Project}-${Environment}-deployment-group
      ServiceRoleArn: !GetAtt CodeDeployServiceRole.Arn
      DeploymentConfigName: CodeDeployDefault.AllAtOnce
      Ec2TagFilters:
        - Key: Name
          Value: !Sub ${Project}-${Environment}-server
          Type: KEY_AND_VALUE
      DeploymentStyle:
        DeploymentOption: WITHOUT_TRAFFIC_CONTROL
        DeploymentType: IN_PLACE
      AutoRollbackConfiguration:
        Enabled: true
        Events:
          - DEPLOYMENT_FAILURE

  # ════════════════════════════════════════════
  # CODEBUILD — React app build
  # ════════════════════════════════════════════

  ReactCodeBuildProject:
    Type: AWS::CodeBuild::Project
    DependsOn: PipelineRole
    Properties:
      Name: !Join ["-", [!Ref Project, "react", !Ref Environment]]
      Source:
        Type: CODEPIPELINE
        BuildSpec: buildspec.yml
      Artifacts:
        Type: CODEPIPELINE
      ServiceRole: !GetAtt PipelineRole.Arn
      TimeoutInMinutes: 20
      Environment:
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/standard:7.0
        Type: LINUX_CONTAINER
        EnvironmentVariables:
          - Name: PROJECT
            Value: !Ref Project
          - Name: ENVIRONMENT
            Value: !Ref Environment
          - Name: NODE_ENV
            Value: production
      Cache:
        Type: S3
        Location: !Sub ${ArtifactsBucket}/cache/react-${Environment}
      LogsConfig:
        CloudWatchLogs:
          Status: ENABLED
          GroupName: !Sub /aws/codebuild/${Project}-react-${Environment}

  # ════════════════════════════════════════════
  # CODEPIPELINE — React app  (Source → Build → Deploy)
  # ════════════════════════════════════════════

  ReactPipeline:
    Type: AWS::CodePipeline::Pipeline
    DependsOn:
      - ArtifactBucket
      - ReactCodeBuildProject
      - CodeDeployDeploymentGroup
    Properties:
      Name: !Join ["-", [!Ref Project, "react", !Ref Environment]]
      RoleArn: !GetAtt PipelineRole.Arn
      ArtifactStore:
        Type: S3
        Location: !Ref ArtifactsBucket
      Stages:

        - Name: Source
          Actions:
            - Name: FetchSource
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: CodeStarSourceConnection
                Version: 1
              Configuration:
                ConnectionArn: !Ref ConnectionArn
                FullRepositoryId: !Ref ReactRepository
                BranchName: !Ref ReactBranch
                DetectChanges: true
                OutputArtifactFormat: CODE_ZIP
              OutputArtifacts:
                - Name: SourceOutput

        - Name: Build
          Actions:
            - Name: BuildReactApp
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: 1
              InputArtifacts:
                - Name: SourceOutput
              OutputArtifacts:
                - Name: BuildOutput
              Configuration:
                ProjectName: !Ref ReactCodeBuildProject

        - Name: Deploy
          Actions:
            - Name: DeployToEC2
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Provider: CodeDeploy
                Version: 1
              InputArtifacts:
                - Name: BuildOutput
              Configuration:
                ApplicationName: !Ref CodeDeployApplication
                DeploymentGroupName: !Ref CodeDeployDeploymentGroup

# ──────────────────────────────────────────────────────────────
# OUTPUTS
# ──────────────────────────────────────────────────────────────
Outputs:

  WebAppURL:
    Description: Public URL of the React application
    Value: !Sub http://${EC2Instance.PublicDnsName}
    Export:
      Name: !Sub ${Project}-${Environment}-WebAppURL

  EC2PublicIP:
    Description: EC2 Public IP
    Value: !GetAtt EC2Instance.PublicIp
    Export:
      Name: !Sub ${Project}-${Environment}-EC2IP

  ReactPipelineURL:
    Description: React app CodePipeline URL
    Value: !Sub https://${AWS::Region}.console.aws.amazon.com/codesuite/codepipeline/pipelines/${ReactPipeline}/view

  CodeDeployAppName:
    Description: CodeDeploy Application name
    Value: !Ref CodeDeployApplication

  SSHCommand:
    Description: SSH into EC2 (after downloading key from SSM)
    Value: !Sub ssh -i ${Project}-${Environment}-keypair.pem ec2-user@${EC2Instance.PublicIp}

  SSMKeyCommand:
    Description: CLI command to download private key from SSM
    Value: !Sub >
      aws ssm get-parameter
      --name /ec2/keypair/${EC2KeyPair.KeyPairId}
      --with-decryption
      --query Parameter.Value
      --output text
      --region ${AWS::Region}
      > ${Project}-${Environment}-keypair.pem && chmod 400 ${Project}-${Environment}-keypair.pem
